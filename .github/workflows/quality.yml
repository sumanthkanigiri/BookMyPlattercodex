name: Flutter quality and release validation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ['.', admin, website]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - if: hashFiles(format('{0}/test/**/*.dart', matrix.package)) != ''
        run: flutter test --coverage
      - if: matrix.package == 'admin'
        run: flutter build web --release --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci-validation-key --dart-define=PROJECT_ID=example
      - if: matrix.package == 'website'
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-validation-key
          PROJECT_ID: example
        run: |
          touch "$RUNNER_TEMP/bookmyplatter.env"
          ENV_FILE="$RUNNER_TEMP/bookmyplatter.env" ../tool/website_with_env.sh build web --release

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci-validation-key --dart-define=PROJECT_ID=example --dart-define=GOOGLE_MAPS_API_KEY=ci-validation-key

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
      - run: deno check supabase/functions/*/index.ts

  supabase-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local
      - run: supabase db lint --local --level error

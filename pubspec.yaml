name: bookmyplatter
description: Production-ready Flutter customer app for BookMyPlatter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  equatable: ^2.0.7
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  razorpay_flutter: ^1.4.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
